name: Publish to NPM

on:
  push:
    branches:
      - master
    paths:
      - package.json

permissions:
  contents: read

jobs:
  publish:
    name: Publish changed package version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Detect package version change
        id: version
        shell: bash
        run: |
          set -euo pipefail

          package_name="$(node -p "require('./package.json').name")"
          new_version="$(node -p "require('./package.json').version")"
          old_version=""

          if git cat-file -e "${{ github.event.before }}:package.json" 2>/dev/null; then
            old_version="$(git show "${{ github.event.before }}:package.json" | node -e "const fs = require('fs'); process.stdout.write(JSON.parse(fs.readFileSync(0, 'utf8')).version)")"
          fi

          echo "package_name=${package_name}" >> "$GITHUB_OUTPUT"
          echo "new_version=${new_version}" >> "$GITHUB_OUTPUT"

          if [ "$old_version" != "$new_version" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether version already exists
        if: steps.version.outputs.changed == 'true'
        id: npm
        shell: bash
        run: |
          set -euo pipefail

          if npm view "${{ steps.version.outputs.package_name }}@${{ steps.version.outputs.new_version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Enable Corepack
        if: steps.version.outputs.changed == 'true' && steps.npm.outputs.exists == 'false'
        run: corepack enable

      - name: Install dependencies
        if: steps.version.outputs.changed == 'true' && steps.npm.outputs.exists == 'false'
        run: pnpm install --frozen-lockfile

      - name: Build package
        if: steps.version.outputs.changed == 'true' && steps.npm.outputs.exists == 'false'
        run: pnpm run build

      - name: Publish to NPM
        if: steps.version.outputs.changed == 'true' && steps.npm.outputs.exists == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
